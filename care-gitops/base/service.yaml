apiVersion: v1
kind: Service
metadata:
  name: care-backend-svc
spec:
  selector:                   # "app=care-backend" 라벨을 가진 pod를 찾아서 연결
    app: care-backend
  ports:
    - port: 80                # Service는 80번으로 받아서
      targetPort: 3000        # 실제 컨테이너의 3000번 포트로 전달
  type: ClusterIP             # 클러스터 내부에서만 접근 가능 -> 외부 노출은 나중에 별도로 설정 (Ingress 등)