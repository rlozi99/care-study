apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: care-backend-hpa
spec:
  scaleTargetRef:               # 어떤 deployment을 대상으로 하는지 지정 -> care-backend를 지정
    apiVersion: apps/v1
    kind: Deployment
    name: care-backend
  minReplicas: 2                # 최소 2개는 항상 유지 (트래픽 없어도 서버는 떠있어야 하니까)
  maxReplicas: 10               # 최대 10개 까지 늘어날 수 있음
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # CPU 사용률 평균이 70% 넘으면 pod 늘리기 시작