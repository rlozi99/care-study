apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: care-stage
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: care-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1                # 환경마다 다른 값을 쓸 수 있다는 것을 표현하기 위해 1